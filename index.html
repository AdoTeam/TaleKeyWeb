<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hediye Kampanyası</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #111;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
        }
        .btn {
            background-color: #ffcc00;
            color: #000;
            padding: 15px 30px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.4);
            transition: 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .hidden {
            display: none !important;
        }
        .warning-text {
            font-size: 18px;
            line-height: 1.5;
            margin-bottom: 20px;
            color: #ff4d4d;
            font-weight: bold;
        }
        .timer {
            font-size: 45px;
            font-weight: bold;
            color: #ff3333;
            margin: 20px 0;
            letter-spacing: 2px;
        }
        .link-btn {
            display: inline-block;
            background-color: #fff;
            color: #000;
            padding: 12px 25px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 16px;
        }
        /* Süre bittiğinde kırmızı ekran durumu */
        body.red-screen {
            background-color: #b30000 !important;
        }
        .cartell-text {
            font-size: 36px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div id="step1">
            <button class="btn" id="clickBtn">Hediye İçin Tıkla</button>
        </div>

        <div id="step2" class="hidden">
            <p class="warning-text">Gerçek jojoyu kaçırdım adam ol öldürürüm eğer 60 saniye içinde bu vakfa 300 bin TL atmazsan</p>
            <div class="timer" id="timerDisplay">01:00</div>
            <a href="https://talemods.com/" class="link-btn" target="_blank">Vakıf İçin Tıkla</a>
        </div>
    </div>

    <script>
        const clickBtn = document.getElementById('clickBtn');
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const timerDisplay = document.getElementById('timerDisplay');
        const mainContainer = document.getElementById('mainContainer');

        let timeLeft = 60;
        let timerInterval;

        clickBtn.addEventListener('click', () => {
            step1.classList.add('hidden');
            step2.classList.remove('hidden');
            
            // Geri sayımı başlat
            timerInterval = setInterval(() => {
                timeLeft--;
                
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                
                let formattedTime = 
                    String(minutes).padStart(2, '0') + ':' + 
                    String(seconds).padStart(2, '0');
                
                timerDisplay.textContent = formattedTime;

                // Süre bittiğinde
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    triggerRedScreen();
                }
            }, 1000);
        });

        function triggerRedScreen() {
            document.body.classList.add('red-screen');
            mainContainer.innerHTML = '<div class="cartell-text">BY ARABIC MEXICAN CARTELLS</div>';
        }
    </script>
</body>
</html>
